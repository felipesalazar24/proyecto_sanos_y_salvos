version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Agregar aquí las variables de entorno necesarias
      # - NEXT_PUBLIC_API_URL=http://localhost:8000
    # Descomenta para desarrollo con hot reload:
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    # environment:
    #   - NODE_ENV=development
    # command: npm run dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
