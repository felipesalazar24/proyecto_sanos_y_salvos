apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservicios-ingress
  namespace: microservicios
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: micro.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ms-bff
                port:
                  number: 8084

          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ms-bff
                port:
                  number: 8084

          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: ms-auth
                port:
                  number: 8083

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
