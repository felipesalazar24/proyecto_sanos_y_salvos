# Deployment del microservicio de autenticación.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: microservicios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: bff:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: AUTH_URL
              value: "http://ms-auth:8083/api/v1/auth/login"
            # Conexión a PostgreSQL (DNS interno de Kubernetes).
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initalDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initalDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "521Mi"
              cpu: "500m"

---
# Service ClusterIP expuesto al Ingress en el puerto 8084.
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: microservicios
  labels:
    app: bff
spec:
  selector:
    app: bff
  ports:
    - port: 8084
      targetPort: 8084
  type: ClusterIP