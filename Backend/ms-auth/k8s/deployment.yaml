apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-auth
  template:
    metadata:
      labels:
        app: ms-auth
    spec:
      containers:
        - name: ms-auth
          image: ms-auth:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://auth-postgres:5432/db_auth"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-secrets
                  key: DB_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES
              value: "true"
            - name: JWT_ISSUER
              value: "http://ms-auth:8083"
            - name: JWT_PRIVATE_KEY_PATH
              value: "/run/keys/private_key.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/run/keys/public_key.pem"
            - name: SECURITY_JWT_ISSUER
              value: "http://ms-auth:8083"
            - name: SECURITY_JWT_PRIVATE_KEY_PATH
              value: "/run/keys/private_key.pem"
            - name: SECURITY_JWT_PUBLIC_KEY_PATH
              value: "/run/keys/public_key.pem"
          volumeMounts:
            - name: jwt-keys-volume
              mountPath: /run/keys/private_key.pem
              subPath: private_key.pem
              readOnly: true
            - name: jwt-keys-volume
              mountPath: /run/keys/public_key.pem
              subPath: public_key.pem
              readOnly: true
      volumes:
        - name: jwt-keys-volume
          secret:
            secretName: auth-secrets
            items:
              - key: PRIVATE_KEY
                path: private_key.pem
              - key: PUBLIC_KEY
                path: public_key.pem
---
apiVersion: v1
kind: Service
metadata:
  name: ms-auth
  namespace: microservicios
spec:
  selector:
    app: ms-auth
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP