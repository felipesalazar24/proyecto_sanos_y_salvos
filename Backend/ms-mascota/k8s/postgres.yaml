apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pet-postgres-pvc
  namespace: microservicios
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-postgres
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pet-postgres
  template:
    metadata:
      labels:
        app: pet-postgres
  template:
    metadata:
      labels:
        app: pet-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pet-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pet-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pet-secrets
                  key: DB_NAME
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pet-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pet-postgres
  namespace: microservicios
spec:
  selector:
    app: pet-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP