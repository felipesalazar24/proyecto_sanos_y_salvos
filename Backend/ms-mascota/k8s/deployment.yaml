# Deployment del microservicio de autenticación.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pets
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-pets
  template:
    metadata:
      labels:
        app: ms-pets
    spec:
      containers:
        - name: ms-pets
          image: ms-pets:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            # Conexión a PostgreSQL (DNS interno de Kubernetes).
            - name: DB_HOST
              value: pets-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: pets-secrets
                  key: DB_NAME
            - name: DB_pets
              valueFrom:
                secretKeyRef:
                  name: pets-secrets
                  key: DB_pets
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pets-secrets
                  key: DB_PASSWORD
            # Clave para firmar/verificar los JWT.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pets-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES
              value: "24h"
---
# Service ClusterIP expuesto al Ingress en el puerto 8082.
apiVersion: v1
kind: Service
metadata:
  name: ms-pets
  namespace: microservicios
spec:
  selector:
    app: ms-pets
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP