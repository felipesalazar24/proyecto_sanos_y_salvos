apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-pet
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-pet
  template:
    metadata:
      labels:
        app: ms-pet
    spec:
      containers:
        - name: ms-pet
          image: ms-pet:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://pet-postgres:5432/db_mascotas"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pet-secrets
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pet-secrets
                  key: DB_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "validate"
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: ms-pet
  namespace: microservicios
spec:
  selector:
    app: ms-pet
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP