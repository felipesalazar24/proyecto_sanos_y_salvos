version: '3.8'

services:
  db-user:
    image: postgres:15-alpine
    container_name: db_ms_user
    environment:
      POSTGRES_DB: db_user
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - ./data/user_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felipe_admin -d db_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanos-y-salvos-network

  ms-user:
    build:
      context: ./Backend/ms-user
      dockerfile: Dockerfile
    container_name: ms_user_app
    depends_on:
      db-user:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-user:5432/db_user
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8081
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SENTRY_DSN: http://8dc2b5a1e5b742ee979d0c89de2b8c29@glitchtip-web:8000/25479
    ports:
      - "8081:8081"
    networks:
      - sanos-y-salvos-network

  db-auth:
    image: postgres:15-alpine
    container_name: db_ms_auth
    environment:
      POSTGRES_DB: db_auth
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felipe_admin -d db_auth"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanos-y-salvos-network

  ms-auth:
    build:
      context: ./Backend/ms-auth
      dockerfile: Dockerfile
    container_name: ms_auth_app
    depends_on:
      - ms-user
      - db-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-auth:5432/db_auth
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8083
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
      JWT_ISSUER: "http://ms-auth:8083"
      JWT_PRIVATE_KEY_PATH: "/run/keys/private_key.pem"
      JWT_PUBLIC_KEY_PATH: "/run/keys/public_key.pem"
      SECURITY_JWT_ISSUER: "http://ms-auth:8083"
      SECURITY_JWT_PRIVATE_KEY_PATH: "/run/keys/private_key.pem"
      SECURITY_JWT_PUBLIC_KEY_PATH: "/run/keys/public_key.pem"
      SENTRY_DSN: http://8dc2b5a1e5b742ee979d0c89de2b8c29@glitchtip-web:8000/25479
    volumes:
      - ./private_key.pem:/run/keys/private_key.pem:ro
      - ./public_key.pem:/run/keys/public_key.pem:ro
    ports:
      - "8083:8083"
    networks:
      - sanos-y-salvos-network

  db-pets:
    image: postgres:15-alpine
    container_name: db_ms_pets
    environment:
      POSTGRES_DB: db_pets
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felipe_admin -d db_pets"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanos-y-salvos-network

  ms-pets:
    build:
      context: ./Backend/ms-pet
      dockerfile: Dockerfile
    container_name: ms_pets_app
    depends_on:
      db-pets:
        condition: service_healthy 
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pets:5432/db_pets
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8082
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SENTRY_DSN: http://8dc2b5a1e5b742ee979d0c89de2b8c29@glitchtip-web:8000/25479
    ports:
      - "8082:8082"
    networks:
      - sanos-y-salvos-network

  db-notifications:
    image: postgres:15-alpine
    container_name: db_ms_notifications
    environment:
      POSTGRES_DB: db_notifications
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5435:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felipe_admin -d db_notifications"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanos-y-salvos-network

  ms-notification:
    build:
      context: ./Backend/ms-notification
      dockerfile: Dockerfile
    container_name: ms_notification_app
    depends_on:
      db-notifications:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-notifications:5432/db_notifications
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8085
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SENTRY_DSN: http://8dc2b5a1e5b742ee979d0c89de2b8c29@glitchtip-web:8000/25479
    ports:
      - "8085:8085"
    networks:
      - sanos-y-salvos-network

  bff:
    build:
      context: ./Backend/bff
      dockerfile: Dockerfile
    container_name: bff_app
    depends_on:
      - ms-auth
      - ms-user
      - ms-pets
      - ms-notification
    environment:
      SERVER_PORT: 8084
      AUTH_URL: "http://ms-auth:8083"
      USERS_URL: "http://ms-user:8081"
      PETS_URL: "http://ms-pets:8082"
      NOTIFICATIONS_URL: "http://ms-notification:8085"
      JWK_URI: "http://ms-auth:8083/.well-known/jwks.json"
      ENDPOINTS_MS_AUTH: "http://ms-auth:8083"
      SENTRY_DSN: http://8dc2b5a1e5b742ee979d0c89de2b8c29@glitchtip-web:8000/25479
    ports:
      - "8084:8084"
    networks:
      - sanos-y-salvos-network
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - sanos-y-salvos-network

  glitchtip-db:
    image: postgres:16
    container_name: glitchtip_db
    restart: always
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    volumes:
      - glitchtip-pg-data:/var/lib/postgresql/data
    networks:
      - sanos-y-salvos-network

  glitchtip-redis:
    image: redis:7-alpine
    container_name: glitchtip_redis
    restart: always
    networks:
      - sanos-y-salvos-network

  glitchtip-web:
    image: glitchtip/glitchtip:v4.1
    container_name: glitchtip_web_app
    restart: always
    depends_on:
      - glitchtip-db
      - glitchtip-redis
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://felipe_admin:password123@glitchtip-db:5432/glitchtip
      - REDIS_URL=redis://glitchtip-redis:6379/0
      - PORT=8000
      - SECRET_KEY=un_texto_largo_y_aleatorio_sanos_y_salvos
      - GLITCHTIP_DOMAIN=http://localhost:8000
      - ENABLE_VOLUMETRIC_LIMITS=False
    networks:
      - sanos-y-salvos-network

  glitchtip-worker:
    image: glitchtip/glitchtip:v4.1
    container_name: glitchtip_worker
    restart: always
    depends_on:
      - glitchtip-db
      - glitchtip-redis
    environment:
      - DATABASE_URL=postgres://felipe_admin:password123@glitchtip-db:5432/glitchtip
      - REDIS_URL=redis://glitchtip-redis:6379/0
      - GLITCHTIP_DOMAIN=http://localhost:8000
    networks:
      - sanos-y-salvos-network

networks:
  sanos-y-salvos-network:
    driver: bridge

volumes:
  glitchtip-pg-data: