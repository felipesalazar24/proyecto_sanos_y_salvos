version: '3.8'

services:
  db-usuarios:
    image: postgres:15-alpine
    container_name: db_ms_usuarios
    environment:
      POSTGRES_DB: db_usuarios
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - ./data/usuarios_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felipe_admin -d db_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanos-y-salvos-network

  ms-usuarios:
    build:
      context: ./Backend/ms-usuario
      dockerfile: Dockerfile
    container_name: ms_usuarios_app
    depends_on:
      db-usuarios:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-usuarios:5432/db_usuarios
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8081
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    ports:
      - "8081:8081"
    networks:
      - sanos-y-salvos-network

  db-auth:
    image: postgres:15-alpine
    container_name: db_ms_auth
    environment:
      POSTGRES_DB: db_auth
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    networks:
      - sanos-y-salvos-network

  ms-auth:
    build:
      context: ./Backend/ms-auth
      dockerfile: Dockerfile
    container_name: ms_auth_app
    depends_on:
      - ms-usuarios
      - db-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-auth:5432/db_auth
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8083
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES: "true"
      JWT_ISSUER: "http://ms-auth:8083"
      JWT_PRIVATE_KEY_PATH: "/run/keys/private_key.pem"
      JWT_PUBLIC_KEY_PATH: "/run/keys/public_key.pem"
      SECURITY_JWT_ISSUER: "http://ms-auth:8083"
      SECURITY_JWT_PRIVATE_KEY_PATH: "/run/keys/private_key.pem"
      SECURITY_JWT_PUBLIC_KEY_PATH: "/run/keys/public_key.pem"
    volumes:
      - ./private_key.pem:/run/keys/private_key.pem:ro
      - ./public_key.pem:/run/keys/public_key.pem:ro
    ports:
      - "8083:8083"
    networks:
      - sanos-y-salvos-network

  db-mascotas:
    image: postgres:15-alpine
    container_name: db_ms_mascotas
    environment:
      POSTGRES_DB: db_mascotas
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felipe_admin -d db_mascotas"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanos-y-salvos-network

  ms-mascotas:
    build:
      context: ./Backend/ms-mascota
      dockerfile: Dockerfile
    container_name: ms_mascotas_app
    depends_on:
      db-mascotas:
        condition: service_healthy 
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-mascotas:5432/db_mascotas
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8082
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    ports:
      - "8082:8082"
    networks:
      - sanos-y-salvos-network

  db-notifications:
    image: postgres:15-alpine
    container_name: db_ms_notifications
    environment:
      POSTGRES_DB: db_notifications
      POSTGRES_USER: felipe_admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5435:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felipe_admin -d db_notifications"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sanos-y-salvos-network

  ms-notification:
    build:
      context: ./Backend/ms-notification
      dockerfile: Dockerfile
    container_name: ms_notification_app
    depends_on:
      db-notifications:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-notifications:5432/db_notifications
      SPRING_DATASOURCE_USERNAME: felipe_admin
      SPRING_DATASOURCE_PASSWORD: password123
      SERVER_PORT: 8085
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    ports:
      - "8085:8085"
    networks:
      - sanos-y-salvos-network

  ms-bff:
    build:
      context: ./Backend/bff
      dockerfile: Dockerfile
    container_name: bff_app
    depends_on:
      - ms-auth
      - ms-usuarios
      - ms-mascotas
      - ms-notification
    environment:
      SERVER_PORT: 8084
      AUTH_URL: "http://ms-auth:8083"
      USERS_URL: "http://ms-usuarios:8081"
      PETS_URL: "http://ms-mascotas:8082"
      NOTIFICATIONS_URL: "http://ms-notification:8085"
      JWK_URI: "http://ms-auth:8083/.well-known/jwks.json"
      ENDPOINTS_MS_AUTH: "http://ms-auth:8083"
    ports:
      - "8084:8084"
    networks:
      - sanos-y-salvos-network
      
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  sanos-y-salvos-network:
    driver: bridge